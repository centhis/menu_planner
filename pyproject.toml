[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations"]

[[tool.mypy.overrides]]
module = ["alembic", "sqlalchemy", "sqlalchemy.*"]
ignore_missing_imports = true
